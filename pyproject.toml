[project]
name = "codefix-agent"
version = "0.1.0"
description = "CodeFix: GitHub issue to verified pull request, running on TrueForge."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["skills/codefix/scripts/cf.py", "codefix_setup"]
